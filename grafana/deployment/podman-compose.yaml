services:
  grafana:
    image: docker.io/grafana/grafana:13.1
    container_name: kubecost-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource,marcusolsson-treemap-panel
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_FEATURE_TOGGLES_ENABLE=kubernetesClientDashboardsFolders
    volumes:
      - ../dashboards:/var/lib/grafana/dashboards:ro,z
      - ./provisioning:/etc/grafana/provisioning:ro,z
